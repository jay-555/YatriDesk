<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Can't reach the server</title>
<style>:root{--brand:#9f1239;--brand-d:#7a0e2c;--bg:#faf7f5;--card:#fff;--ink:#1c1917;--mute:#6b6560;--line:#e7e1dc;--ok:#15803d;--bad:#b91c1c}
@media (prefers-color-scheme:dark){:root{--bg:#141110;--card:#1f1b19;--ink:#f5f1ee;--mute:#a8a29e;--line:#34302d}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:30rem;margin:0 auto;padding:max(2.5rem,env(safe-area-inset-top)) 1.25rem max(1.5rem,env(safe-area-inset-bottom))}
.logo{display:block;width:72px;height:72px;border-radius:18px;margin:1.5rem auto .75rem}
h1{font-size:1.6rem;line-height:1.2;text-align:center;margin:.25rem 0}
.sub{text-align:center;color:var(--mute);margin:0 0 1.5rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1.1rem}
label{display:block;font-weight:600;margin-bottom:.4rem}
input{width:100%;font:inherit;padding:.8rem .9rem;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);min-height:48px}
input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid color-mix(in srgb,var(--brand) 55%,transparent);outline-offset:2px}
.hint{color:var(--mute);font-size:.875rem;margin:.5rem 0 0}
.btn{display:flex;align-items:center;justify-content:center;gap:.5rem;width:100%;min-height:48px;margin-top:.9rem;border:0;border-radius:12px;background:var(--brand);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.btn:active{background:var(--brand-d)}
.btn[disabled]{opacity:.6}
.btn.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--line)}
.msg{margin:.9rem 0 0;padding:.7rem .9rem;border-radius:12px;font-size:.95rem}
.msg.bad{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
.msg.ok{background:color-mix(in srgb,var(--ok) 12%,transparent);color:var(--ok)}
.recent{list-style:none;margin:1.25rem 0 0;padding:0}
.recent h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:0 0 .5rem}
.recent button{width:100%;text-align:left;min-height:48px;padding:.7rem .9rem;margin-bottom:.5rem;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.foot{text-align:center;color:var(--mute);font-size:.8rem;margin-top:1.5rem}
.foot a{color:inherit}
@media (prefers-reduced-motion:no-preference){.btn{transition:background .15s}}
</style>
</head>

  <p class="sub" id="where">Check that this phone is on the restaurant WiFi (or has internet, if an online address is saved) and the server computer is on.</p>
  <div class="card">
    <button class="btn" id="retry" type="button">Try again</button>
    <button class="btn ghost" id="standalone" type="button">Open the standalone point of sale</button>
    <button class="btn ghost" id="change" type="button">Change server</button>
    <p class="hint">Deliveries you already marked on this phone are kept and sent when the connection is back.</p>
  </div>
</main>
<script>
(function(){
  var N=window.YatriDeskNative;
  var url=N?N.serverUrl():'';
  if(url){document.getElementById('where').textContent='Could not reach '+url+'. Check that this phone is on the restaurant WiFi and the server computer is on.';}
  document.getElementById('retry').addEventListener('click',function(){if(N&&N.retry)N.retry();else location.href=url||'/';});
  document.getElementById('standalone').addEventListener('click',function(){if(N&&N.openStandalone)N.openStandalone();});
  // Keep trying quietly, and go back to the app by itself as soon as the server answers.
  if(url){var tries=0;var t=setInterval(function(){tries++;fetch(url+'/api/v1/auth/setup-status',{mode:'no-cors',cache:'no-store'}).then(function(){clearInterval(t);if(N&&N.retry)N.retry();else location.href=url;}).catch(function(){});if(tries>200)clearInterval(t);},4000);}
  document.getElementById('change').addEventListener('click',function(){if(N)N.forgetServer();else location.href='/';});
})();
</script>
